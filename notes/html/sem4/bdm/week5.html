rgin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span style="margin-right:0.1952em;" class="mspace mtight"></span><span class="mord mathnormal mtight">i</span><span style="margin-right:0.1952em;" class="mspace mtight"></span><span class="mord mtight">2</span><span style="margin-right:0.03148em;" class="mord mathnormal mtight">πnk</span><span class="mord mtight">/</span><span style="margin-right:0.10903em;" class="mord mathnormal mtight">N</span></span></span></span></span></span></span></span></span></span></span></span></span><p>Normally this sum would run over all <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.10903em;" class="mord mathnormal">N</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">8</span></span></span></span> values of <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6944em;" class="strut"></span><span style="margin-right:0.03148em;" class="mord mathnormal">k</span></span></span></span>. But since only <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span style="margin-right:0.07847em;" class="mord mathnormal">X</span><span class="mopen">(</span><span class="mord">0</span><span class="mclose">)</span></span></span></span>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span style="margin-right:0.07847em;" class="mord mathnormal">X</span><span class="mopen">(</span><span class="mord">1</span><span class="mclose">)</span></span></span></span>, and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span style="margin-right:0.07847em;" class="mord mathnormal">X</span><span class="mopen">(</span><span class="mord">7</span><span class="mclose">)</span></span></span></span> were stored, the sum is <strong>truncated</strong> — it uses only those coefficients (the "<span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6944em;" class="strut"></span><span style="margin-right:0.03148em;" class="mord mathnormal">k</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">1</span></span></span></span>" term automatically covers its conjugate partner <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6944em;" class="strut"></span><span style="margin-right:0.03148em;" class="mord mathnormal">k</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">7</span></span></span></span> through the symmetry relation). The reconstruction is denoted <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span style="height:0.6944em;" class="vlist"><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span class="mord mathnormal">x</span></span><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span style="left:-0.2222em;" class="accent-body"><span class="mord"></span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">{</span><span class="mord">2.1</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">2.9</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">3.8</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">4.0</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">3.1</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">2.0</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">1.1</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">0.9</span><span class="mclose">}</span></span></span></span></span><p>Compare this side by side with the true original signal:</p>

<thead>
<tr>
<th>Index <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.4306em;" class="strut"></span><span class="mord mathnormal">n</span></span></span></span></th>
<th>Original <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord mathnormal">x</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></th>
<th>Reconstructed <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span style="height:0.6944em;" class="vlist"><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span class="mord mathnormal">x</span></span><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span style="left:-0.2222em;" class="accent-body"><span class="mord"></span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span> in the table above is the cost.</p>
<p>This produces a fundamental <strong>trade-off</strong>:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8889em;vertical-align:-0.1944em;" class="strut"></span><span class="mord text"><span class="mord">Accuracy&nbsp;of&nbsp;Reconstruction</span></span><span style="margin-right:1em;" class="mspace"></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">⟺</span><span style="margin-right:1em;" class="mspace"></span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord text"><span class="mord">Storage&nbsp;/&nbsp;Data&nbsp;Reduction</span></span></span></span></span></span><p>There is no universal rule dictating exactly how many coefficients to keep. Keeping more coefficients (e.g., adding <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span style="margin-right:0.07847em;" class="mord mathnormal">X</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span></span></span></span> and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span style="margin-right:0.07847em;" class="mord mathnormal">X</span><span class="mopen">(</span><span class="mord">6</span><span class="mclose">)</span></span></span></span>, which would cost 2 more numbers since <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span style="margin-right:0.07847em;" class="mord mathnormal">X</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span></span></span></span> is complex) reduces the reconstruction error but also reduces the compression ratio — moving from 3 numbers to 5 numbers, for instance, gives a smaller error but a smaller percentage saving. The decision boils down to a practical question: <em>how much error can be tolerated?</em> If 10% error is acceptable, one might settle for 3 numbers; if higher fidelity is required, more coefficients must be retained.</p>

<h2 class="atx" id="7-when-not-to-use-lossy-reduction--the-medical-data-warning">7. When NOT to Use Lossy Reduction — The Medical Data Warning</h2>
<p>This is the most important caveat of the whole DFT-based approach: <strong>it is a lossy method</strong>, and lossy methods are dangerous when applied carelessly to sensitive data.</p>
<p>Consider a patient represented as a data object:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span class="mord text"><span class="mord">Patient</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">→</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord mathnormal">x</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">{</span><span class="mord text"><span class="mord">BP</span></span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord text"><span class="mord">HbA1c</span></span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord text"><span class="mord">Weight</span></span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord text"><span class="mord">Height</span></span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="minner">…</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mclose">}</span></span></span></span></span><p>Suppose this vector has 15 numbers describing the patient's vitals and lab values, and the goal is to reduce storage. Applying a DFT here and keeping only the top few coefficients might introduce something like a 10% error.</p>
<div class="plantuml"><img src="https://www.plantuml.com/plantuml/svg/~1U5vDZy5An40CXk_p5B55w4Ats8D7PLr4zk2XgE2bb-nCMWTdCijC1bn4drqwsuEd_84lNv9T4eoIlLDNfuYpHt1u3baWUH9aL8uc0GaGxVmXO6maBJQmGYqXGZMWM6Af01ESBbaj2FBi2AglXZTm1z_xeON3yQ7NxSZljAXQEAorwxgVaPl-5ZZx8yMqAJQ3Wb0_B-pUPVflVNnw6xbn8QNpoau2zIiw7rZbH1eJGVL29cioHJHoyzlVN0F56E9bPdco7Yn_AhKU3jljVQ5LsLswIPIPfEIGHUs8JVRk3opoPhu"></div>
<p>A 10% error on a blood pressure reading or an HbA1c level is not a harmless rounding artifact — it can distort downstream <strong>medical diagnosis</strong>. Therefore:</p>
<blockquote>
<p><strong>Rule of thumb:</strong> Do <strong>not</strong> apply DFT — or <em>any</em> lossy data reduction method — to sensitive data such as medical records. If storage reduction is genuinely required for such data, only <strong>lossless</strong> methods should be considered (though these typically achieve far lower compression efficiency, which is why they are not the focus of this discussion).</p>
</blockquote>
<p>The broader lesson: before reducing any dataset, first <strong>decide whether reduction is even appropriate</strong> for that data, and only then choose a method.</p>
<div class="plantuml"><img src="https://www.plantuml.com/plantuml/svg/~1U5vLZq5Bmq0GXU_xAvxfHQ7HUm_QOb64KWLx4NAP9cEok3kRximA-VUIu46F3xxtFTvMZRAL6DpLcAcFX41JAWQDR2Ja0dyQB27xVZ1qFdDhFeahoYqfetfHT6G4PL5l_fll6XbyFzHgzCNwK84K5pVtIFh0gFO9nzSJQ1p3r4X8gXCoTsKHBxWahDufn2H_UuV_P2FN-wVJ6c-FkpNOsjkRHY9DE3EeRNaqEWTUT1ChLeVvm7Dc5kSkgElxUMM33zRVE5CR79FRidGbXX_Ncs3B"></div>
<blockquote>
<p><strong>Note for Review:</strong> Exam questions often test <em>judgment</em>, not just formulas — expect a scenario question asking "should you apply DFT here?" The correct instinct is always: check whether losing information is acceptable for that domain before reaching for a compression technique.</p>
</blockquote>
<hr>
<h2 class="atx" id="8-enter-pca--the-height-andamp-weight-story">8. Enter PCA — The Height &amp; Weight Story</h2>
<p>Having seen one method (DFT) that reduces data by exploiting <em>frequency-domain energy concentration</em>, the lecture now introduces a second, conceptually different method: <strong>Principal Component Analysis (PCA)</strong>.</p>

th aria-label="Height: 1.3; Weight: 1.3" role="graphics-symbol" aria-roledescription="point" transform="translate(83.2,192.4)" d="M4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,-4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,4.743416490252569,0" fill="#8B5CF6" stroke-width="2" opacity="0.7"></path><path aria-label="Height: 2.5; Weight: 2.5" role="graphics-symbol" aria-roledescription="point" transform="translate(160,130)" d="M4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,-4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,4.743416490252569,0" fill="#8B5CF6" stroke-width="2" opacity="0.7"></path><path aria-label="Height: 2.8; Weight: 2.8" role="graphics-symbol" aria-roledescription="point" transform="translate(179.2,114.40000000000002)" d="M4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,-4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,4.743416490252569,0" fill="#8B5CF6" stroke-width="2" opacity="0.7"></path><path aria-label="Height: 4.2; Weight: 4.2" role="graphics-symbol" aria-roledescription="point" transform="translate(268.8,41.59999999999998)" d="M4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,-4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,4.743416490252569,0" fill="#8B5CF6" stroke-width="2" opacity="0.7"></path><path aria-label="Height: 4.5; Weight: 4.5" role="graphics-symbol" aria-roledescription="point" transform="translate(288,25.999999999999993)" d="M4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,-4.743416490252569,0A4.743416490252569,4.743416490252569,0,1,1,4.743416490252569,0" fill="#8B5CF6" stroke-width="2" opacity="0.7"></path></g><g class="mark-line role-mark layer_1_marks" role="graphics-object" aria-roledescription="line mark container"><path aria-label="x: 0.5; y: 0.5" role="graphics-symbol" aria-roledescription="line mark" d="M32,234L320,0" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,2"></path></g></g><path class="foreground" aria-hidden="true" d="" display="none"></path></g></g></g></svg><form class="vega-bindings"></form></div>
<p>Since height and weight move together — they are <strong>correlated</strong> — there is redundancy in keeping them as two separate variables. Physically, it makes sense to combine them into a single derived quantity, something like an <strong>"overall body size"</strong> score. Instead of storing two numbers per person, only one is needed.</p>
<p>That diagonal direction along which the points line up is not just a visual curiosity — it is the most important idea in PCA:</p>
<blockquote>
<p><strong>PCA essentially tries to find the direction along which the data varies (the direction of maximum variance).</strong></p>
</blockquote>
<p>The reasoning: moving from person A to person B to person C, <em>something</em> is changing — that change is what statisticians call <strong>variance</strong>. The direction along which this change is largest is the direction that best distinguishes the data points from one another. Find that direction, and you have found the most informative "summary axis" of the data.</p>
<hr>
<h2 class="atx" id="9-what-pca-actually-does">9. What PCA Actually Does</h2>
<p>Putting it precisely:</p>
<blockquote>
<p><strong>PCA combines <em>correlated</em> variables into new variables called principal components.</strong></p>
</blockquote>
<p>In the height/weight example, the two original variables (height, weight) are combined into one new variable (overall body size) — this new variable is called a <strong>principal component</strong>. In general, a dataset with many variables might be reducible to a smaller number of principal components: for example, 5 original variables might be reduced to just 3 principal components.</p>
<div class="plantuml"><img src="https://www.plantuml.com/plantuml/svg/~1U5vjZR4Ama0GHFlxYZKsMbZOMeXeeOMWO65ZirpMv61lB-pj6UBNIqJGmcgOcSVC9XkgbSXkqYas4O5nICKWHp8KT4nt0qkWeMaDwg3aBIHnew8qJ50TQEmgm0mjJ8-ZsNAXN-JwHVfVf6Joc0cgquCKcM6RwW4kuKatcPqrY0yTCknIx9AG62pdxv_EBpypUoKIvrfOBDRlU0K-gHAZKUtw__66f2wHN_M_LWu"></div>
<p>The critical pre-condition: <strong>PCA only works if variables are correlated.</strong> If two variables move independently of each other (uncorrelated), there is no redundancy to exploit, and PCA will not usefully compress them.</p>
<hr>
<h2 class="atx" id="10-worked-example--maths-andamp-physics-marks">10. Worked Example — Maths &amp; Physics Marks</h2>
<p>To make the mechanics concrete, consider four students (A, B, C, D) with (deliberately extreme) marks in Maths and Physics:</p>
<table>
<thead>
<tr>
<th>Student</th>
<th>Maths</th>
<th>Physics</th>
</tr>
</thead>
<tbody><tr>
<td>A</td>
<td>2</td>
<td>2</td>
</tr>
<tr>
<td>B</td>
<td>3</td>
<td>3</td>
</tr>
<tr>
<td>C</td>
<td>4</td>
<td>4</td>
</tr>
<tr>
<td>D</td>
<td>5</td>
<td>5</td>
</tr>
</tbody></table>
<p>This data is intentionally trivial — Maths and Physics marks are <em>identical</em> for every student, i.e., perfectly correlated — so the PCA procedure and its outcome are easy to verify by hand.</p>
<h3 class="atx" id="step-1--collect-the-data-points">Step 1 — Collect the Data Points</h3>
<p>Treat each student as a 2D data point:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">2</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">2</span><span class="mclose">)</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mopen">(</span><span class="mord">3</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">3</span><span class="mclose">)</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mopen">(</span><span class="mord">4</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">4</span><span class="mclose">)</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mopen">(</span><span class="mord">5</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">5</span><span class="mclose">)</span></span></span></span></span><h3 class="atx" id="step-2--mean-computation">Step 2 — Mean Computation</h3>
<p>Compute the mean of each variable across all students:</p>

<h3 class="atx" id="step-4a--find-the-direction-of-maximum-variance">Step 4a — Find the Direction of Maximum Variance</h3>
<p>The central question PCA asks is:</p>
<blockquote>
<p><strong>Along which direction does the centered data spread/vary the most?</strong></p>
</blockquote>
<p>Plotting <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">−</span><span class="mord">1.5</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">−</span><span class="mord">1.5</span><span class="mclose">)</span></span></span></span>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">−</span><span class="mord">0.5</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">−</span><span class="mord">0.5</span><span class="mclose">)</span></span></span></span>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">0.5</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">0.5</span><span class="mclose">)</span></span></span></span>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">1.5</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">1.5</span><span class="mclose">)</span></span></span></span> shows they all fall exactly on the <strong>diagonal line</strong> <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.625em;vertical-align:-0.1944em;" class="strut"></span><span style="margin-right:0.03588em;" class="mord mathnormal">y</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.4306em;" class="strut"></span><span class="mord mathnormal">x</span></span></span></span>. (In real datasets this direction is almost never visually obvious — it must be computed mathematically, typically via eigenvectors of the covariance matrix — but here it can be read off directly, which is exactly why this toy example is useful for building intuition.)</p>
<p>A <strong>unit vector</strong> (magnitude 1) is defined along this diagonal direction and called the <strong>first principal component</strong>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.07153em;" class="mord mathnormal">PC</span><span class="mord">1</span></span></span></span>:</p>

<h3 class="atx" id="step-4b--project-the-centered-data-onto-pc1">Step 4b — Project the Centered Data onto PC1</h3>
<p>"Projecting" onto <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.07153em;" class="mord mathnormal">PC</span><span class="mord">1</span></span></span></span> means taking the <strong>dot product</strong> of each centered data point with the <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.07153em;" class="mord mathnormal">PC</span><span class="mord">1</span></span></span></span> vector — this collapses each 2D point into a single number, the <strong>PC1 score</strong>.</p>
<p>For student A, with centered point <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">−</span><span class="mord">1.5</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">−</span><span class="mord">1.5</span><span class="mclose">)</span></span></span></span>:</p>

<h3 class="atx" id="the-result-10-numbers-→-5-numbers">The Result: 10 Numbers → 5 Numbers</h3>
<p>Originally, each of the 4 students required <strong>2 numbers</strong> (Maths mark, Physics mark) — <strong>8 numbers total</strong>, or 10 if you count the fact that in general each variable also needs its own stored mean value for reconstruction later (2 means + 8 data values = 10). PCA replaces the two correlated variables with a <strong>single PC1 score per student</strong>:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord text"><span class="mord">Total&nbsp;numbers&nbsp;required&nbsp;(with&nbsp;PC1)</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.7278em;vertical-align:-0.0833em;" class="strut"></span><span class="mord">4</span><span class="mord text"><span class="mord">&nbsp;scores</span></span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.8889em;vertical-align:-0.1944em;" class="strut"></span><span class="mord">1</span><span class="mord text"><span class="mord">&nbsp;direction&nbsp;vector’s&nbsp;worth&nbsp;of&nbsp;bookkeeping</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">≈</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6944em;" class="strut"></span><span class="mord">5</span><span class="mord text"><span class="mord">&nbsp;numbers</span></span></span></span></span></span><p>That is a <strong>50% reduction</strong> — and, just as with the DFT example, this compression is not free: reconstructing the original marks from the PC1 score alone would reintroduce some error, exactly the same accuracy-vs-storage trade-off seen earlier.</p>
<p>The scores also carry meaning: student D's score (+2.12) is higher than student A's (-2.12), correctly reflecting that D scored better in both subjects than A — the single PC1 number still preserves the <em>ranking</em> information of the original two variables.</p>
<blockquote>
<p><strong>Note for Review:</strong> The reason this example works so cleanly is that Maths and Physics marks are <em>perfectly</em> correlated (identical, in fact). In real data, correlation is rarely perfect, so the "diagonal direction" won't be exactly 45°, and it must be found using eigen-decomposition of the covariance matrix rather than by eyeballing a scatter plot. The takeaway concept — project onto the direction of maximum variance — remains exactly the same.</p>
</blockquote>
<h3 class="atx" id="dft-vs-pca--a-quick-contrast">DFT vs. PCA — A Quick Contrast</h3>
<table>
<thead>
<tr>
<th>Aspect</th>
<th>DFT</th>
<th>PCA</th>
</tr>
</thead>
<tbody><tr>
<td>Domain of operation</td>
<td>Time → Frequency (uses complex exponentials)</td>
<td>Original variable space → New "component" space</td>
</tr>
<tr>
<td>What it exploits</td>
<td>Energy concentration in a few frequency coefficients</td>
<td>Correlation between variables</td>
</tr>
<tr>
<td>Core mathematical tool</td>
<td>Complex exponentials, conjugate symmetry</td>
<td>Mean centering, direction of maximum variance (later: eigenvectors)</td>
</tr>
<tr>
<td>Requires correlated input?</td>
<td>No</td>
<td><strong>Yes</strong> — without correlation, PCA gives no benefit</td>
</tr>
</tbody></table>

<h2 class="atx" id="11-practice-questions">11. Practice Questions</h2>
<ol>
<li><p>Suppose a new 8-point signal has DFT magnitudes that are <strong>all exactly equal</strong> (no energy compaction at all). What would this imply about the effectiveness of discarding "small" coefficients, and would keeping just 3 coefficients still be a reasonable strategy? Justify your reasoning.</p>
</li>
<li><p>In the medical data example, imagine that instead of blood pressure and HbA1c, the 15 numbers included things like "patient ID" and "zip code." Would your earlier objection to using DFT still apply to <em>these</em> particular variables? What distinguishes data where lossy compression is dangerous from data where it might be tolerable?</p>
</li>
<li><p>If a dataset has three variables — two of which are strongly correlated and one of which is completely independent of the other two — what would you expect PCA to do with the independent variable? Would you expect to gain any storage reduction from it, and why?</p>
</li>
<li><p>In the Maths/Physics example, the reduction went from 2 variables to 1 principal component. If a third subject, say Chemistry, were added with marks that are also perfectly identical to Maths and Physics for every student, how many principal components would you expect to be needed to fully capture the data, and why?</p>
</li>
<li><p>The lecture states that DFT exploits energy compaction in the <em>frequency</em> domain, while PCA exploits correlation in the <em>variable</em> domain. Construct a short argument for why a dataset could respond well to PCA but poorly to a DFT-based reduction (or vice versa) — think about what kind of "structure" each method is actually looking for.</p>
</li>
</ol>
