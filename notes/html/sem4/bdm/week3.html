<h2 class="atx" id="recap-and-roadmap">Recap and Roadmap</h2>
<p>This course is structured around four questions that recur throughout every topic we study. Knowing them by heart helps you place any new concept into context — whenever we introduce something new, it is almost always in service of answering one of these four questions. This lecture is devoted to the <strong>first</strong> question in detail, and then transitions into the <strong>second</strong>.</p>
<p>The first question — <em>what are the attributes or features of the data</em> — is primarily about <strong>terminology</strong>. It doesn't carry deep conceptual weight on its own, but it establishes the vocabulary that every later discussion depends on. If a dataset is described as "a data object with attribute so-and-so," you need to know precisely what that means.</p>
<hr>
<h2 class="atx" id="anatomy-of-a-dataset-from-d-to-observations">Anatomy of a Dataset: From D to Observations</h2>
<p>Every discussion starts with a dataset (or database), denoted <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.02778em;" class="mord mathnormal">D</span></span></span></span>. This is the all-encompassing unit — everything the analysis will ever touch lives inside it. From here, we peel back layers of abstraction one at a time.</p>
<p><strong>Dataset <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.02778em;" class="mord mathnormal">D</span></span></span></span></strong> comprises <strong>data objects</strong>. A data object is simply an <em>entity</em> — a single entry recorded in the database. A database can (and usually does) contain many data objects.</p>
<p>Consider a <strong>Sales Database</strong>. Its data objects could include:</p>
<ul>
<li><strong>Customer ID</strong> — identifying information for the person who made the purchase</li>
<li><strong>Store item</strong> — the product being sold</li>
<li><strong>Sales figure</strong> — the record of the sale itself</li>
</ul>
<p>The exact list of data objects depends entirely on context, requirements, and the kind of analysis being performed — there is no fixed universal list.</p>
<p>A <strong>Hospital Database</strong> gives a second example. Here, each <strong>patient</strong> can be thought of as a data object, and a patient may be described through several such objects: patient history, current medication, treatment records, and so on.</p>
<p>Going one level deeper: a data object is itself <strong>characterized by attributes</strong>. An <strong>attribute</strong> is a <em>data field</em> — a feature or characteristic of a data object. The value that an attribute takes for a specific data object is called an <strong>observation</strong>.</p>
<p>Putting it together for a <strong>Customer</strong> data object: the attributes might be Customer-ID, Name, and Address. The specific values those attributes hold for one particular customer (e.g., ID = 4722, Name = "XYZ") are the observations.</p>
<div class="plantuml"><img src="https://www.plantuml.com/plantuml/svg/~1U5vrKD5Amq0GVB-l6DkN5j88HH3w8Aq6HH1zK4J5byrbcwRDtPMzZL2_NYurA89lkyFCxEmiev9evrfpiXUg7Q6bG-WKqR6I9wDX3mqeWsfmg1fXgqtmngI1VDqoHWKfHLOK8r14WV5TKs_qiktuBmiFvPQjlli9vtKEmbKNDJYMQIyDvVOVyKfLch9JnYckcRGJ7am6YzbjaU6U76TOLPLmZ4TJKfLlrnjXzhypFPIHvOFIHuFTsVbydk7bzIq3bNR85J5-fDQbnmlCPXTzr0LiS7jf8aUJzeJtrnQm6nAooj9ySeNoO7hyA8nOG6d74H-KEZ8-A4DIPmZhH31FeMRTi6IWjat8a3Bs3C-c8gKKWgrY7SIXqOYVbfxPQX0peNoNKpvKXYCyDUmhfAl6BDbNdMk_02o7hpG"></div>
<blockquote>
<p><strong>Note for Review:</strong> Keep the hierarchy straight — <strong>Database → Data Object → Attribute → Observation</strong>. Almost every terminology confusion in this course traces back to mixing up which level of this hierarchy a term belongs to.</p>
</blockquote>
<hr>
<h2 class="atx" id="the-many-aliases-of-an-attribute">The Many Aliases of an Attribute</h2>
<p>The word "attribute" is not universal — the same underlying idea shows up under different names depending on which field you're standing in. This is purely a matter of disciplinary convention, but recognizing it prevents unnecessary confusion when switching between textbooks or communities.</p>
<table>
<thead>
<tr>
<th>Term</th>
<th>Field Where It's the Popular Choice</th>
</tr>
</thead>
<tbody><tr>
<td><strong>Attribute</strong></td>
<td>Data Mining</td>
</tr>
<tr>
<td><strong>Feature</strong> (or <em>feature vector</em>)</td>
<td>Machine Learning</td>
</tr>
<tr>
<td><strong>Dimension</strong></td>
<td>Data Warehousing</td>
</tr>
<tr>
<td><strong>Variable</strong></td>
<td>Statistics</td>
</tr>
</tbody></table>
<p>All four terms describe exactly the same thing: a characteristic of a data object. When you encounter any of them going forward, translate it mentally into "a describable property of the thing being recorded."</p>
<hr>
<h2 class="atx" id="attribute-vectors-the-heterogeneous-cousin-of-ml-feature-vectors">Attribute Vectors: The Heterogeneous Cousin of ML Feature Vectors</h2>
<p>If we collect all the attributes of one data object into a single ordered list, we get an <strong>attribute vector</strong> (equivalently, a <em>feature vector</em> — the term you likely already know from ML).</p>

-174 2.7-5 6-9 10-13 .7-1 7.3-1 20-1h17z"></path></svg></span></span></span><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord text"><span class="mord">abc</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.648em;" class="vlist"><span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:1.3341em;" class="vlist"><span></span></span></span></span></span><span class="mclose">}</span></span></span></span></span><p>This is where data mining departs from the "clean" ML feature vector you may be used to. In machine learning, feature vectors are typically <strong>purely numeric</strong> — every entry is a number you can meaningfully interpret as big or small. Here, however, the vector mixes an ID, a name (text), and an address (text). This is called a <strong>heterogeneous vector</strong>: an attribute vector whose entries come from entirely different attribute types and cannot be meaningfully compared to one another (you cannot compare a name to an ID).</p>
<blockquote>
<p><strong>Note for Review:</strong> "Heterogeneous" is the key word examiners like to test. It doesn't mean the vector is disorganized — it means the entries are not mutually comparable because they represent fundamentally different kinds of attributes.</p>
</blockquote>
<hr>
<h2 class="atx" id="types-of-attributes">Types of Attributes</h2>
<p>Not all attributes behave the same way mathematically. Knowing an attribute's <em>type</em> tells you exactly what operations (comparison, averaging, subtraction) are actually meaningful to perform on it. There are four types worth knowing well.</p>
<h3 class="atx" id="1-nominal-categorical-attributes">1. Nominal (Categorical) Attributes</h3>
<p>Values are drawn from a fixed, predefined set of category names — nothing more. Examples:</p>
<ul>
<li><strong>Occupation</strong> = {doctor, driver, teacher, …}</li>
<li><strong>Gender</strong> = {M, F, other}</li>
<li><strong>Customer ID</strong> = 4722 (a system-generated label, not a "real" number)</li>
</ul>
<p>By definition, nominal attributes carry <strong>no quantitative meaning</strong>. Statements like "4722 &gt; 4615" or "the average customer ID is 3749.74" are technically computable but <strong>meaningless</strong> — customer IDs were never numbers in the arithmetic sense to begin with.</p>
<p>Despite lacking quantitative meaning, nominal attributes are still extremely valuable for <strong>pattern discovery</strong> — e.g., noticing that customers with occupation "doctor" tend to buy a certain category of car.</p>
<h3 class="atx" id="2-binary-attributes">2. Binary Attributes</h3>
<p>A special case of nominal attributes restricted to exactly <strong>two</strong> categories:</p>
<ul>
<li>True / False</li>
<li>1 / 0</li>
<li>Positive / Negative (e.g., a malaria test result)</li>
<li>Male / Female</li>
</ul>
<p>Binary attributes are still nominal in spirit — "1 &gt; 0" or "1 + 0 = 1" carries no real meaning here — but their two-valued structure makes them common and worth naming separately (e.g., married/unmarried fields in a database).</p>
<h3 class="atx" id="3-ordinal-attributes">3. Ordinal Attributes</h3>
<p>Unlike nominal attributes, ordinal attributes <strong>do carry numerical significance</strong> — you can meaningfully compare them — but the values are still restricted to a <strong>discrete</strong>, predefined set (no values are allowed "in between").</p>
<p><strong>Example — Quality of Service rating:</strong></p>
<table>
<thead>
<tr>
<th>Score</th>
<th>Meaning</th>
</tr>
</thead>
<tbody><tr>
<td>0</td>
<td>Very dissatisfied</td>
</tr>
<tr>
<td>1</td>
<td>Somewhat dissatisfied</td>
</tr>
<tr>
<td>2</td>
<td>Neutral</td>
</tr>
<tr>
<td>3</td>
<td>Satisfied</td>
</tr>
<tr>
<td>4</td>
<td>Very satisfied</td>
</tr>
</tbody></table>
<p>Notice that 1.5 or 3.7945 are not permitted — only the five discrete levels exist. Yet the ranking is meaningful: a rating of 3 genuinely indicates more satisfaction than a rating of 0.</p>
<p><strong>Example — Letter Grades:</strong></p>
<table>
<thead>
<tr>
<th>Grade</th>
<th>Grade Point</th>
</tr>
</thead>
<tbody><tr>
<td>A</td>
<td>10</td>
</tr>
<tr>
<td>A-</td>
<td>9</td>
</tr>
<tr>
<td>B</td>
<td>8</td>
</tr>
<tr>
<td>B-</td>
<td>7</td>
</tr>
<tr>
<td>C</td>
<td>6</td>
</tr>
</tbody></table>
<p>A grade of 7.5 is never awarded — only the discrete points on this scale are valid. Because the scale is numerically meaningful, it <em>can</em> be averaged — this is exactly what a <strong>CGPA</strong> is: the mean of several ordinal grade points (e.g., a CGPA of 6.79 vs. 7.54 for two different students).</p>
<p>Restricting grades to discrete points (instead of allowing continuous values like 9.7945 vs. 9.7897) is a deliberate design choice: it <strong>reduces unnecessary variance</strong> in comparisons. If arbitrary decimal precision were allowed, instructors would end up making distinctions between students that are not really meaningful — the discreteness forces a clear threshold between "this is an A" and "this is an A-."</p>
<h3 class="atx" id="4-continuous-attributes">4. Continuous Attributes</h3>
<p>Any numeric value is permitted — 6.7943, 4, 9, or anything in between. Continuous attributes have full arithmetic meaning, but their physical interpretation can be less "clean" than an ordinal attribute's discrete, well-defined categories.</p>

<h2 class="atx" id="how-to-summarize-and-understand-data-better">How to Summarize and Understand Data Better</h2>
<p>Real-world datasets are large — a sales database might have thousands of customers and objects running into lakhs or crores of transactions. Manually inspecting every row is infeasible, and usually unnecessary: what you actually want, as a first instinct, is a <strong>summary</strong>. A good summary can immediately tell you whether last month's sales deviated meaningfully from the trend, sparing you a deep dive unless something looks off.</p>
<p>Before diving into specific summary measures, we need two foundational terms: <strong>population</strong> and <strong>sample</strong>.</p>
<p><strong>Data</strong>, in this context, means a <em>set of measurements</em> — numbers collected during an experiment or investigation (e.g., blood pressure, heart rate, sales, profit). This is distinct from nominal attributes gathered through a survey or interview (like a customer's name); measurement implies you are recording a genuine numeric quantity.</p>
<hr>
<h2 class="atx" id="parameter-vs-statistic-the-unknown-truth-vs-your-best-guess">Parameter vs. Statistic: The Unknown Truth vs. Your Best Guess</h2>
<ul>
<li><strong>Parameter</strong>: a set of meaningful measurements corresponding to the <strong>entire collection of units</strong> — i.e., the <strong>population</strong>.</li>
<li><strong>Statistic</strong>: a set of measurements collected on a <strong>randomly selected subset of units</strong> from that collection — i.e., the <strong>sample</strong>.</li>
</ul>
<p><strong>Worked example:</strong> Suppose the question is *"what is the average blood pressure of 25-year-old males?"* Implicit in this question is a reference to the <em>entire population</em> of 25-year-old males in the world. Measuring blood pressure for every single one of them and averaging the results gives you the <strong>parameter</strong>.</p>
<p>In practice, measuring an entire population is essentially never possible. Instead, you take a <strong>sample</strong> — say, 35 randomly chosen individuals — measure their blood pressure, and average those values. That average is the <strong>statistic</strong>.</p>
<div class="plantuml"><img src="https://www.plantuml.com/plantuml/svg/~1U5vTa35kmp0CHNUTuZTP7A2vG8OYwDAbGm2lNXYRSOHIb25HBTpJ5ugTekacYFyzVFAOZPAL8EvfIZG6Wj0SYo47Db9omXU3HIG_NWs3JzoRZ-fSVP2EmjYSubI4wdUd3QlvnEYZo195lA2ejxpRW39ESSBslTfUfV1VJKjX4kwqIQH3338ZStNmW5pEcMqHj1HMmLjYreSYb2YmSGAcJfkY7ng_z1cM2kEJfF3Q0TkM9CG7k3KodyttmBI_adNQh7XWoYNniC9Nib_UrNNs-nUSS40k8L3otppWFBlQypQf-V_3ErP31omB8zS3U1tT3RbRlLuuiVQCXhFvGCOxvuwiGmdo0_FBcTi"></div>
<p>Conventionally, the parameter is written as <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.625em;vertical-align:-0.1944em;" class="strut"></span><span class="mord mathnormal">p</span></span></span></span>, and the corresponding sample estimate is written with a "hat," <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8889em;vertical-align:-0.1944em;" class="strut"></span><span class="mord accent"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.6944em;" class="vlist"><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span class="mord mathnormal">p</span></span><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span style="left:-0.1667em;" class="accent-body"><span class="mord"></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.1944em;" class="vlist"><span></span></span></span></span></span></span></span></span></span><p>In practice, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.625em;vertical-align:-0.1944em;" class="strut"></span><span class="mord mathnormal">p</span></span></span></span> is <strong>always unknown</strong> — you can never measure the entire population — while <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8889em;vertical-align:-0.1944em;" class="strut"></span><span class="mord accent"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.6944em;" class="vlist"><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span class="mord mathnormal">p</span></span><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span style="left:-0.1667em;" class="accent-body"><span class="mord"></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.1944em;" class="vlist"><span></span></span></span></span></span></span></span></span>.</p>
<p>This same idea underlies <strong>generalization</strong> in machine learning: you train a model on a sample (training set) and hope it performs well on the broader population it will eventually encounter (unseen test data).</p>
<p>Questions like *"what percentage of school-going kids play computer games for more than one hour?"* or *"how many mobile phones currently in use are less than one year old?"* are implicitly <strong>population-level questions</strong> — no category or filter is specified. Since the full population can't be measured, the honest answer always comes from a sample, followed by an inference back to the population.</p>
<blockquote>
<p><strong>Note for Review:</strong> Whenever you report a summary statistic, ask yourself: <em>am I describing my sample accurately, and is that description going to be generalized (rightly or wrongly) to the population?</em> This single habit prevents most misleading data summaries.</p>
</blockquote>
<hr>
<h2 class="atx" id="quantifying-central-tendency-mean-median-mode">Quantifying Central Tendency: Mean, Median, Mode</h2>
<p>"Quantifying" a parameter or statistic usually means reducing a dataset to a <strong>single representative number</strong> — mean, median, mode, variance, correlation coefficient, max/min, and so on. These are the <strong>basic characteristics</strong> of any population or sample, and (mode aside) each one gives a <strong>unique</strong> description of the dataset.</p>

<p>Many familiar "means" are special cases of one general formula:</p>

<h3 class="atx" id="the-mean--strengths-and-weaknesses">The Mean — Strengths and Weaknesses</h3>
<p>The (arithmetic) mean is by far the <strong>most widely used</strong> summary statistic. <em>Why</em> it is so dominant is left as an open question worth exploring on your own — but its trade-offs are well documented:</p>
<p><strong>Weaknesses:</strong></p>
<ul>
<li><strong>Sensitive to outliers / skewed data</strong> — a few extreme values can dominate the result.</li>
<li><strong>Same mean, different distributions</strong> — two datasets can share an identical mean while having completely different shapes. The chart below shows two distributions that both have <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.625em;vertical-align:-0.1944em;" class="strut"></span><span class="mord mathnormal">μ</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">0.296</span></span></span></span>, despite looking nothing alike.</li>
<li><strong>Not always interpretable / may not exist in the data.</strong> For instance, filling a missing value with the mean of its neighbors (e.g., inserting 3.5 between a 3 and a 4) produces a value that was <em>never actually observed</em>. Similarly, a statement like "there are 50.21 computers per sq. km in a city" is mathematically valid but physically strange.</li>
</ul>
<p><strong>Strengths:</strong></p>
<ul>
<li>Easy to compute and <strong>uses every data value</strong> (unlike median or mode, which ignore most of the dataset).</li>
<li><strong>Self-correcting</strong> as the number of random samples increases.</li>
</ul>

<blockquote>
<p><strong>Open question from the lecture:</strong> why is the mean so overwhelmingly popular despite these documented weaknesses? This is left as a genuine research question — try to work out the reasoning yourself before looking it up.</p>
</blockquote>
<h3 class="atx" id="the-median">The Median</h3>
<p>The median is the <strong>central value</strong> of the data once arranged in numerical order.</p>
<ul>
<li><strong>Not affected by outliers</strong> — a small number of extreme values cannot drag it around the way they can the mean.</li>
<li><strong>More useful for skewed data</strong>, precisely because it ignores the magnitude of extreme values.</li>
</ul>
<p>Despite these robustness advantages, the median is <strong>less popular than the mean</strong> in practice. This is posed as a genuine open question worth exploring: robustness alone doesn't guarantee popularity — what does the median lose that makes analysts reach for the mean instead?</p>
<p><strong>Histogram skewness</strong> is directly relevant here: some distributions are symmetric (little to no skew), some are right-skewed (small values dominate in count), some are left-skewed (large values dominate in count), and some are roughly uniform (all bins have similar counts). Whenever your data is skewed, the median is generally the more representative "typical value."</p>
<h3 class="atx" id="the-mode">The Mode</h3>
<p>The mode is the value (or category) with the <strong>highest frequency</strong>.</p>
<ul>
<li><strong>Not necessarily unique</strong> — a dataset can have multiple modes, or none at all. Note carefully: *"no mode" does not imply the mode is zero* — it simply means no single value dominates.</li>
<li><strong>Ignores a lot of information</strong> — it only looks at frequency, discarding everything else about the distribution.</li>
<li><strong>Especially useful for nominal or qualitative data</strong>, where mean and median are not even mathematically valid (you cannot average "doctor" and "driver").</li>
</ul>
<h3 class="atx" id="why-having-all-three-isnand39t-always-enough">Why Having All Three Isn't Always Enough</h3>
<p>Consider two datasets:</p>
<ul>
<li><strong>Set A:</strong> 99, 99, 100, 100, 100, 100, 100, 101, 101</li>
<li><strong>Set B:</strong> 1, 1, 99, 100, 100, 100, 101, 199, 199</li>
</ul>
<p>Both sets share the <strong>exact same mean, median, and mode: 100.</strong> Yet they are visibly very different datasets — Set B has extreme values pulled far away on both ends, while Set A is tightly clustered.</p>

ledescription="tick" d="M397,95h2v20h-2Z" fill="#829eb1" opacity="0.7"></path></g></g><path class="foreground" aria-hidden="true" d="" display="none"></path></g></g></g></svg><form class="vega-bindings"></form></div>
<p>This is the central lesson: <strong>mean, median, and mode can all agree while the underlying data is completely different.</strong> A single summary number is never the whole story — this is exactly why we also need measures of <em>spread</em>, discussed next.</p>
<p>Two natural follow-up questions worth sitting with:</p>
<ul>
<li>When summarizing <strong>employee salaries</strong> in an organization, which of mean, median, or mode is more suitable — and why?</li>
<li>Given two companies' share returns over the last five years, A (%) = {1.8, 1.9, 2.0, 2.1, 2.3} and B (%) = {1.0, 1.1, 1.0, 0.9, 1.3}, which would you invest in, and why? (Hint: mean and median alone won't fully answer this — you'll need spread too.)</li>
</ul>
<hr>
<h2 class="atx" id="quantifying-spread-variance-and-standard-deviation">Quantifying Spread: Variance and Standard Deviation</h2>
<p>A single "typical value" is never enough — you also need to know how spread out the data is around that value. Consider a second version of the share-return example: A (%) = {1.8, 1.9, 2.0, 2.1, 3.6} and B (%) = {1.0, 1.5, 2.0, 3.0, 3.9}. These now differ noticeably in spread even if their central tendency looks similar — which is exactly what <strong>variance</strong> is designed to capture.</p>
<p><strong>Variance</strong> is the mean squared deviation from the population mean:</p>

span></span><span style="top:-3.2029em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span style="margin-right:0.10903em;" class="mord mathnormal mtight">N</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.2997em;" class="vlist"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3117em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mord mathnormal">μ</span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span style="height:0.8141em;" class="vlist"><span style="top:-3.063em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.686em;" class="vlist"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span><p><strong>Standard deviation</strong> is simply the positive square root of the variance: <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.4306em;" class="strut"></span><span style="margin-right:0.03588em;" class="mord mathnormal">σ</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:1.04em;vertical-align:-0.0849em;" class="strut"></span><span class="mord sqrt"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.9551em;" class="vlist"><span style="top:-3em;" class="svg-align"><span style="height:3em;" class="pstrut"></span><span style="padding-left:0.833em;" class="mord"><span class="mord"><span style="margin-right:0.03588em;" class="mord mathnormal">σ</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span style="height:0.7401em;" class="vlist"><span style="top:-2.989em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span><span style="top:-2.9151em;"><span style="height:3em;" class="pstrut"></span><span style="min-width:0.853em;height:1.08em;" class="hide-tail"><svg preserveAspectRatio="xMinYMin slice" viewBox="0 0 400000 1080" height="1.08em" width="400em" xmlns="http://www.w3.org/2000/svg"><path d="M95,702

<p>Two questions worth pondering on your own: <em>which of variance and standard deviation is more popular in practice, and do they really represent the same underlying idea, or are there meaningful differences in how each is used?</em></p>
<blockquote>
<p><strong>Note for Review:</strong> Mean, median, mode, variance, and standard deviation are measures you've likely used since school — but <em>popularity is not the same as suitability</em>. Always ask which measure is appropriate for the specific question you're answering, not just which one is most familiar.</p>
</blockquote>
<h3 class="atx" id="when-both-parameter-and-statistic-are-known">When Both Parameter and Statistic Are Known</h3>
<p>Normally, the population parameter is unknown, which is precisely why we rely on a sample statistic. But in the rare case where <strong>both</strong> <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.625em;vertical-align:-0.1944em;" class="strut"></span><span class="mord mathnormal">p</span></span></span></span> and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8889em;vertical-align:-0.1944em;" class="strut"></span><span class="mord accent"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.6944em;" class="vlist"><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span class="mord mathnormal">p</span></span><span style="top:-3em;"><span style="height:3em;" class="pstrut"></span><span style="left:-0.1667em;" class="accent-body"><span class="mord"></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.1944em;" class="vlist"><span></span></span></span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">3.1</span></span></span></span>, that deviation is a signal — perhaps the sampling procedure was flawed, or some subgroup was under-represented.</p>
<hr>
<h2 class="atx" id="other-robust-summary-measures">Other Robust Summary Measures</h2>
<p>Beyond mean/median/mode and variance/standard deviation, a few additional measures are worth having in your toolkit — especially when robustness to outliers matters.</p>
<h3 class="atx" id="range-and-dynamic-range">Range and Dynamic Range</h3>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord text"><span class="mord">Range</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.7512em;vertical-align:-0.0833em;" class="strut"></span><span class="mop">max</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">−</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mop">min</span></span></span></span></span><p>Range is simple and useful for quick comparisons, but it only ever looks at the two most extreme values in the entire dataset.</p>
<p>A logarithmic variant, the <strong>dynamic range</strong>, is often more informative:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord text"><span class="mord">Dynamic&nbsp;Range</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:1.836em;vertical-align:-0.686em;" class="strut"></span><span class="mop"><span class="mop">lo<span style="margin-right:0.01389em;">g</span></span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.207em;" class="vlist"><span style="top:-2.4559em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">10</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.2441em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.1667em;" class="mspace"></span><span class="minner"><span style="top:0em;" class="mopen delimcenter"><span class="delimsizing size2">(</span></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.1076em;" class="vlist"><span style="top:-2.314em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mop">min</span></span></span><span style="top:-3.23em;"><span style="height:3em;" class="pstrut"></span><span style="border-bottom-width:0.04em;" class="frac-line"></span></span><span style="top:-3.677em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mop">max</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.686em;" class="vlist"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span style="top:0em;" class="mclose delimcenter"><span class="delimsizing size2">)</span></span></span></span></span></span></span><p>This measure is widely used in <strong>digital photography</strong>, <strong>audio</strong>, and <strong>signal processing</strong>. In photography, a scene's dynamic range tells you how much contrast (brightness variation) it contains — a higher dynamic range means the scene contains both much brighter and much darker points together, rather than being relatively uniform.</p>
<p><strong>Example — real-world luminance range:</strong></p>

<td>Full moon</td>
<td><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.7278em;vertical-align:-0.0833em;" class="strut"></span><span class="mord">6</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">×</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.8141em;" class="strut"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span style="height:0.8141em;" class="vlist"><span style="top:-3.063em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">3</span></span></span></span></span></span></span></span></span></span></span></span></td>

</tr>
</tbody></table>
<p>The luminance of real-world scenes spans roughly <strong>14 orders of magnitude</strong>, from moonless sky to direct sunlight — which is exactly why a <em>logarithmic</em> scale is necessary to make such numbers manageable, and why plain "range" would be a poor way to compare such extreme spreads.</p>
<blockquote>
<p><strong>Open question from the lecture:</strong> how robust are range and dynamic range as summary measures, really? Dynamic range is generally considered the more robust of the two — but think through why, and what specific weaknesses of plain "range" it fixes.</p>
</blockquote>
<h3 class="atx" id="percentiles-and-quartiles">Percentiles and Quartiles</h3>
<p>For <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.4306em;" class="strut"></span><span class="mord mathnormal">n</span></span></span></span> numerically ordered values (interpolating when there is an even number of observations):</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:2.0074em;vertical-align:-0.686em;" class="strut"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.3214em;" class="vlist"><span style="top:-2.314em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">4</span></span></span><span style="top:-3.23em;"><span style="height:3em;" class="pstrut"></span><span style="border-bottom-width:0.04em;" class="frac-line"></span></span><span style="top:-3.677em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord mathnormal">n</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mord">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.686em;" class="vlist"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mpunct">,</span><span style="margin-right:2em;" class="mspace"></span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:2.0074em;vertical-align:-0.686em;" class="strut"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.3214em;" class="vlist"><span style="top:-2.314em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">2</span></span></span><span style="top:-3.23em;"><span style="height:3em;" class="pstrut"></span><span style="border-bottom-width:0.04em;" class="frac-line"></span></span><span style="top:-3.677em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord mathnormal">n</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mord">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.686em;" class="vlist"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mpunct">,</span><span style="margin-right:2em;" class="mspace"></span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:2.113em;vertical-align:-0.686em;" class="strut"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.427em;" class="vlist"><span style="top:-2.314em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">4</span></span></span><span style="top:-3.23em;"><span style="height:3em;" class="pstrut"></span><span style="border-bottom-width:0.04em;" class="frac-line"></span></span><span style="top:-3.677em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.686em;" class="vlist"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span><p>where each formula gives the <strong>position</strong> (rank) in the ordered data at which that quartile lies. Note that:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6944em;" class="strut"></span><span class="mord text"><span class="mord">median</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.8333em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span style="margin-right:0.13889em;" class="mord mathnormal">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">50</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span></span><p>— the median is simply the 50th percentile, which is also the second quartile.</p>
<h3 class="atx" id="inter-quartile-range-iqr">Inter-Quartile Range (IQR)</h3>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord text"><span class="mord">IQR</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span></span><p>The IQR is a <strong>more robust</strong> alternative to the plain range, because it deliberately ignores the most extreme 25% of values on each end — exactly the values that make the plain range so sensitive to outliers.</p>
<p><strong>Try it yourself:</strong> the battery life (in hours) of 12 sample units is:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8389em;vertical-align:-0.1944em;" class="strut"></span><span class="mord">2</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">5</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">6</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">6</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">7</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">8</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">8</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">8</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">9</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">9</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">10</span><span class="mpunct">,</span><span class="mspace">&nbsp;</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">15</span></span></span></span></span><p>The range here is easy: <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6667em;vertical-align:-0.0833em;" class="strut"></span><span class="mord text"><span class="mord">max</span></span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.6679em;" class="strut"></span><span class="mord text"><span class="mord">min</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.7278em;vertical-align:-0.0833em;" class="strut"></span><span class="mord">15</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">2</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">13</span></span></span></span>. Now order the data (it already is ordered), locate <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span> and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8778em;vertical-align:-0.1944em;" class="strut"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span> using the formulas above, and compute the IQR. Compare the two numbers — the gap between them is exactly the kind of robustness difference this section has been building toward.</p>
<blockquote>
<p><strong>Note for Review:</strong> Range only "sees" two data points, no matter how large your dataset is. IQR "sees" the middle 50% of your entire dataset. When you suspect outliers are present, always prefer IQR over range — the same instinct that makes you prefer median over mean in skewed data.</p>
</blockquote>
<hr>
<h2 class="atx" id="practice-questions">Practice Questions</h2>
<p>The following questions are designed to make you actively apply this lecture's vocabulary and reasoning — think them through rather than searching for a one-line answer.</p>
<ol>
<li><p>A ride-sharing app records a <strong>"Trip Rating"</strong> (1 to 5 stars) and <strong>"Trip Distance"</strong> (in km) for every ride. Classify each attribute as nominal, ordinal, or continuous. If an analyst carelessly computed the <em>average</em> trip rating and reported "3.47 stars" as if it were a continuous measurement, what subtle interpretive mistake might they be making about what that number actually represents?</p>
</li>
<li><p>A startup has 40 employees, and the CEO's salary is roughly 20× the typical employee's salary. Which single summary statistic — mean, median, or mode — would you present to investors to describe "typical" pay at the company, and which would you present in a union negotiation arguing that wages are too low? Justify both choices using what you now know about sensitivity to outliers.</p>
</li>
<li><p>Two rooftop sensors log a city's daily temperature for a year. If you were told only the <strong>plain range</strong> (not the dynamic range) of each sensor's readings, could you always correctly judge which sensor recorded more extreme relative swings? Construct a small example dataset for each sensor where the ranges look similar but the dynamic ranges tell a very different story.</p>
</li>
