<h2 class="atx" id="2-step-1-build-the-data-matrix">2. Step 1: Build the Data Matrix</h2>

<h2 class="atx" id="5-step-4-the-covariance-matrix">5. Step 4: The Covariance Matrix</h2>
<p>This step is <strong>new</strong> compared with the previous example. Earlier the data visibly varied along the diagonal <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">1</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span>, so the direction of change was obvious by eye. In general you will <strong>not</strong> be able to see the direction of change just by looking at the data, so we need a general method: compute the <strong>covariance matrix</strong>, then find its eigenvalues and eigenvectors, which give the principal components.</p>

<p>Nothing here is a brand-new quantity: we already know variance and dot products. They simply come together in one special matrix called the <strong>covariance matrix</strong>.</p>

<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.07153em;" class="mord mathnormal">C</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:2.4em;vertical-align:-0.95em;" class="strut"></span><span class="minner"><span style="top:0em;" class="mopen delimcenter"><span class="delimsizing size3">[</span></span><span class="mord"><span class="mtable"><span class="col-align-c"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.45em;" class="vlist"><span style="top:-3.61em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.5</span></span></span><span style="top:-2.41em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.4</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.95em;" class="vlist"><span></span></span></span></span></span><span style="width:0.5em;" class="arraycolsep"></span><span style="width:0.5em;" class="arraycolsep"></span><span class="col-align-c"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.45em;" class="vlist"><span style="top:-3.61em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.4</span></span></span><span style="top:-2.41em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.47</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.95em;" class="vlist"><span></span></span></span></span></span></span></span><span style="top:0em;" class="mclose delimcenter"><span class="delimsizing size3">]</span></span></span></span></span></span></span><blockquote>
<p><strong>Note for Review:</strong> The covariance matrix is <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.7278em;vertical-align:-0.0833em;" class="strut"></span><span class="mord">2</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">×</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">2</span></span></span></span> because we have <strong>two variables</strong>, not because we have two data points. The large off-diagonal entry (<span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">3.4</span></span></span></span>, almost as large as the variances themselves) is the mathematical footprint of "hours and score rise together", and it is exactly this correlation that PCA will exploit.</p>
</blockquote>

<p>The standard way to solve it:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mop">det</span><span class="mopen">(</span><span style="margin-right:0.07153em;" class="mord mathnormal">C</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord mathnormal">λ</span><span style="margin-right:0.07847em;" class="mord mathnormal">I</span><span class="mclose">)</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">0</span></span></span></span></span><p>For our <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.07153em;" class="mord mathnormal">C</span></span></span></span>:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:2.4em;vertical-align:-0.95em;" class="strut"></span><span class="mop">det</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="minner"><span style="top:0em;" class="mopen delimcenter"><span class="delimsizing size3">[</span></span><span class="mord"><span class="mtable"><span class="col-align-c"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.45em;" class="vlist"><span style="top:-3.61em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.5</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mord mathnormal">λ</span></span></span><span style="top:-2.41em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.4</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.95em;" class="vlist"><span></span></span></span></span></span><span style="width:0.5em;" class="arraycolsep"></span><span style="width:0.5em;" class="arraycolsep"></span><span class="col-align-c"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:1.45em;" class="vlist"><span style="top:-3.61em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.4</span></span></span><span style="top:-2.41em;"><span style="height:3em;" class="pstrut"></span><span class="mord"><span class="mord">3.47</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mord mathnormal">λ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.95em;" class="vlist"><span></span></span></span></span></span></span></span><span style="top:0em;" class="mclose delimcenter"><span class="delimsizing size3">]</span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">3.5</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord mathnormal">λ</span><span class="mclose">)</span><span class="mopen">(</span><span class="mord">3.47</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mord mathnormal">λ</span><span class="mclose">)</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.8641em;" class="strut"></span><span class="mord">3.</span><span class="mord"><span class="mord">4</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span style="height:0.8641em;" class="vlist"><span style="top:-3.113em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">0</span></span></span></span></span><p>This is a <strong>quadratic equation in <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6944em;" class="strut"></span><span class="mord mathnormal">λ</span></span></span></span></strong>. Expanding gives <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8974em;vertical-align:-0.0833em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span style="height:0.8141em;" class="vlist"><span style="top:-3.063em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">−</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord text"><span class="mord">trace</span></span><span class="mclose">)</span><span class="mord mathnormal">λ</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mop">det</span><span class="mopen">(</span><span style="margin-right:0.07153em;" class="mord mathnormal">C</span><span class="mclose">)</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">0</span></span></span></span>, where the trace s="vlist-r"><span style="height:0.5344em;" class="vlist"><span></span></span></span></span></span></span></span></span></span><p>There are two eigenvalues because the covariance matrix is <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.7278em;vertical-align:-0.0833em;" class="strut"></span><span class="mord">2</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">×</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">2</span></span></span></span>, and each eigenvalue has a corresponding eigenvector (found in Step 6). Before computing the eigenvectors, let us understand what these two numbers <em>mean</em>.</p>
<hr>
<h2 class="atx" id="7-what-do-the-eigenvalues-mean-physically">7. What Do the Eigenvalues Mean Physically</h2>
<p><strong>Eigenvalues of the covariance matrix represent the amount of variance in each direction.</strong></p>
<p>Recall that PCA is about <strong>direction</strong>: we want the direction in which the data is varying. Now we can be more specific:</p>
<ul>
<li>The <strong>eigenvalues</strong> tell us <em>how much</em> the data varies in a particular direction.</li>
<li>The <strong>eigenvectors</strong> (found next) tell us <em>which direction</em> that is. The first eigenvector is the direction of <strong>maximum variance</strong>; along the second eigenvector the data varies a bit less, and so on.</li>
</ul>
<p>Variance is essentially <strong>change</strong>, and change is what we care about: it is the change that distinguishes student A from student B.</p>
<h3 class="atx" id="total-variation">Total variation</h3>
<p>Since <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8444em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span> and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8444em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span> are the variances along two different directions (two directions because there are two variables), the <strong>total variation</strong> in the data is:</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6944em;" class="strut"></span><span class="mord text"><span class="mord">Total&nbsp;variation</span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.8444em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.8444em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.7278em;vertical-align:-0.0833em;" class="strut"></span><span class="mord">6.88</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">0.083</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">≈</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">6.966</span></span></span></span></span><p>This number does not have a clear physical meaning on its own, but it is useful for <strong>comparison</strong>: given two or more datasets, you can tell which one varies more and which one varies less.</p>
<blockquote>
<p><strong>Note for Review:</strong> Total variation equals the <strong>trace</strong> of <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span style="margin-right:0.07153em;" class="mord mathnormal">C</span></span></span></span> (sum of diagonal entries): <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.7278em;vertical-align:-0.0833em;" class="strut"></span><span class="mord">3.5</span><span style="margin-right:0.2222em;" class="mspace"></span><span class="mbin">+</span><span style="margin-right:0.2222em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">3.47</span><span style="margin-right:0.2778em;" class="mspace"></span><span class="mrel">=</span><span style="margin-right:0.2778em;" class="mspace"></span></span><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">6.97</span></span></span></span>. Rotating the axes to the eigen-directions does not create or destroy variance; it only <strong>redistributes</strong> it, piling it almost entirely onto the first direction.</p>
</blockquote>
<h3 class="atx" id="percentage-of-variance-explained">Percentage of variance explained</h3>
<p>Name the directions <strong>PC1</strong> and <strong>PC2</strong> (principal component 1 and 2), the directions of <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8444em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span> and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8444em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span> respectively.</p>

<p></p>
<p>So the direction that corresponds to <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8444em;vertical-align:-0.15em;" class="strut"></span><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span style="height:0.3011em;" class="vlist"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.15em;" class="vlist"><span></span></span></span></span></span></span></span></span></span> (PC1) carries <strong>98.8%</strong> of all the variation in the data, which is almost everything, and nearly nothing is left for the second direction. Out of the data we have found <em>one</em> direction that holds almost all the change.</p>
<p>With more variables, the variance spreads over more components but always in <strong>decreasing</strong> order. For example, the first component might hold <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8056em;vertical-align:-0.0556em;" class="strut"></span><span class="mord">90%</span></span></span></span>, the second <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8056em;vertical-align:-0.0556em;" class="strut"></span><span class="mord">7.9%</span></span></span></span>, the third <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.8056em;vertical-align:-0.0556em;" class="strut"></span><span class="mord">2.1%</span></span></span></span>. <strong>The first principal component always corresponds to the largest eigenvalue and always captures the most variation in the data.</strong> That is how principal components work.</p>
<p></p>
<hr>
<h2 class="atx" id="8-step-6-finding-the-direction-of-variance">8. Step 6: Finding the Direction of Variance</h2>

<p>This is the <strong>same vector</strong> we established in the previous example, where we just <em>looked</em> at the data and saw that it varied along the diagonal. The new thing is that <strong>we did not visualize anything</strong>. We only used the data: mean-centered it, built the covariance matrix, did the eigenvalue and eigenvector analysis, and the direction fell out.</p>
<p>The data lies somewhere in 2D space and varies in a certain direction that, just by looking, may be hidden. PCA's job is to <strong>bring that hidden dimension out</strong> through this process:</p>

<p>For instance, we get <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">7.08</span></span></span></span> instead of <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">7</span></span></span></span>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">5.91</span></span></span></span> instead of <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">6</span></span></span></span>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">3.08</span></span></span></span> instead of <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">3</span></span></span></span> and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">1.91</span></span></span></span> where we wanted <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">2</span></span></span></span>. Once again, just like DFT, we get <strong>some inaccuracies</strong>, and that is why there is a <strong>trade-off</strong>.</p>
<blockquote>
<p><strong>Note for Review:</strong> Look at the error pattern. Five points are off by a nearly identical tiny shift, while the point <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span class="mopen">(</span><span class="mord">5</span><span class="mpunct">,</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">3</span><span class="mclose">)</span></span></span></span> takes most of the error. That is the point that sits <em>off the diagonal</em>, the same one that breaks the "score keeps rising" pattern (the score stays at <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">3</span></span></span></span> for both <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">4</span></span></span></span> and <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">5</span></span></span></span> hours). PCA with one component forces every point onto the PC1 line, so whatever lies away from that line (the PC2 part of the data) is what gets erased. The total squared error is <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:1em;vertical-align:-0.25em;" class="strut"></span><span style="position:relative;top:0em;" class="mop op-symbol small-op">∑</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord">∥</span><span class="mord mathnormal">x</span><span style="margin-right:0.2222em;" class="mspace"></span><s <h2 class="atx" id="11-lossy-methods-and-the-trade-off">11. Lossy Methods and the Trade-Off</h2>
<p>Both <strong>PCA and DFT are lossy methods for data reduction</strong>. "Lossy" means some information is lost, and that is where the <strong>trade-off</strong> comes from.</p>
<ul>
<li>Be careful about <strong>where</strong> you apply them. For example, with <strong>medical data</strong> you had better not lose information, so you should not apply this kind of reduction there.</li>
<li>If you are comfortable with a trade-off, you can use these methods.</li>
</ul>
<p>There are several such methods:</p>
<table>
<thead>
<tr>
<th>Method</th>
<th>Full name</th>
<th>Remark</th>
</tr>
</thead>
<tbody><tr>
<td><strong>PCA</strong></td>
<td>Principal Component Analysis</td>
<td>Very popular and interesting; eigenvalue and eigenvector based</td>
</tr>
<tr>
<td><strong>DFT</strong></td>
<td>Discrete Fourier Transform</td>
<td>Complex exponential based</td>
</tr>
<tr>
<td><strong>DWT</strong></td>
<td>Discrete Wavelet Transform</td>
<td>Slightly better than DFT, but quite mathematical and it deviates from the main topic of data mining; it is mentioned in the textbook but not covered in depth here</td>
</tr>
<tr>
<td><strong>DCT</strong></td>
<td>Discrete Cosine Transform</td>
<td>Another member of the family</td>
</tr>
</tbody></table>
<p>PCA and DFT are used here as <strong>examples</strong> of lossy data-reduction methods. The key message is not the list of names but that you must be careful about when you apply them.</p>
<hr>
<h2 class="atx" id="12-pca-versus-dft">12. PCA versus DFT</h2>
<p>The two methods operate in very different ways, yet at a closer look share a lot.</p>
<h3 class="atx" id="different-on-the-surface">Different on the surface</h3>
<table>
<thead>
<tr>
<th></th>
<th>PCA</th>
<th>DFT</th>
</tr>
</thead>
<tbody><tr>
<td>Mathematical machinery</td>
<td><strong>Eigenvector / eigenvalue</strong> based</td>
<td><strong>Complex exponentials</strong></td>
</tr>
<tr>
<td>Basis functions</td>
<td><strong>Eigenvectors</strong>, derived <em>from the data itself</em> (from the eigen-decomposition of the covariance matrix)</td>
<td><strong>Complex exponentials</strong>, <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.888em;" class="strut"></span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span style="height:0.888em;" class="vlist"><span style="top:-3.063em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span style="margin-right:0.1952em;" class="mspace mtight"></span><span class="mord mathnormal mtight">i</span><span class="mord mtight">2</span><span style="margin-right:0.03148em;" class="mord mathnormal mtight">πnk</span><span class="mord mtight">/</span><span style="margin-right:0.10903em;" class="mord mathnormal mtight">N</span></span></span></span></span></span></span></span></span></span></span></span>, fixed in advance</td>
</tr>
<tr>
<td>What is measured</td>
<td><strong>Change / variation</strong> (an eigenvalue is the change along one direction)</td>
<td><strong>Frequency</strong></td>
</tr>
</tbody></table>
<h3 class="atx" id="same-underneath">Same underneath</h3>
<ul>
<li>PCA is about <strong>change or variation</strong> (the direction of change).</li>
<li>DFT is about <strong>frequency</strong>, and <strong>frequency is simply the rate of change</strong>. For example, a <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span class="mord">2</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord text"><span class="mord">Hz</span></span></span></span></span> sine means <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">2</span></span></span></span> cycles per second, and a <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6833em;" class="strut"></span><span class="mord">20</span><span style="margin-right:0.1667em;" class="mspace"></span><span class="mord text"><span class="mord">Hz</span></span></span></span></span> sine means <span class="katex"><span class="katex-mathml"></span><span aria-hidden="true" class="katex-html"><span class="base"><span style="height:0.6444em;" class="strut"></span><span class="mord">20</span></span></span></span> cycles per second.</li>
</ul>
<p>So even though they come from different principles, both exploit the same underlying property: <strong>change</strong>. One does it through eigenvalues along directions, the other through complex basis functions and the idea of frequency.</p>

<blockquote>
<p><strong>Note for Review:</strong> Exams like the question "how are PCA and DFT different and how are they similar?" Differ in <strong>basis</strong> (data-derived eigenvectors vs fixed complex exponentials). Similar in <strong>philosophy</strong> (rank components by variance or energy, keep the biggest, accept loss). The basis functions also have interesting mathematical properties beyond physical significance, but these are outside the scope of this course.</p>
</blockquote>
<hr>
<h2 class="atx" id="13-should-you-reduce-data-at-all">13. Should You Reduce Data at All</h2>
<p>Data reduction is useful for <strong>storage</strong>, for <strong>efficiency</strong>, and for general-purpose <strong>analysis</strong> (when you simply want to look at the data in a simpler form). PCA and DFT are two such tools, and DWT and DCT are others.</p>
<p>But it cannot be a blind choice of "I need to reduce my data, so I'll apply PCA" or "somebody applies DFT". You must:</p>
<ol>
<li><strong>First decide whether data reduction is necessary or beneficial</strong> for your data, and in what form.</li>
<li><strong>Understand the implications</strong> of reducing it (what you lose, and whether you can afford to lose it).</li>
<li><strong>Only then</strong> choose a tool such as PCA or DFT.</li>
</ol>
<p>In other words, establish the <strong>context</strong> first. The tools can wait.</p>

<h3 class="atx" id="what-comes-next">What comes next</h3>
<p>With this we conclude the topic of data reduction. The next topic is <strong>clustering</strong>, an interesting aspect of data mining and a form of <strong>unsupervised learning</strong>, beginning with a very basic method called <strong>k-means clustering</strong>.</p>
