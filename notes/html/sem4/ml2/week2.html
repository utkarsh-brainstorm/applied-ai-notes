rd mathnormal">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span style="height:0.8991em;" class="vlist"><span style="top:-3.113em;margin-right:0.05em;"><span style="height:2.7em;" class="pstrut"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">⊤</span></span></span></span></span></span></span></span><span style="margin-right:0.03588em;" class="mord mathnormal">y</span></span></span></span></span><span style="top:-3.2391em;"><span style="height:3.8291em;" class="pstrut"></span><span style="height:1.8291em;border-style:solid;border-width:0.04em;" class="stretchy fbox"></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span style="height:0.59em;" class="vlist"><span></span></span></span></span></span></span></span></span></span><p>This single closed-form expression gives the optimal regression coefficients directly — no iterative search required for this particular model. The overall pattern used to get here (write the loss in vector form → find its gradient → set the gradient to the zero vector → solve) is the same pattern that will reappear, in progressively more complex forms, throughout the rest of the course.</p>
