<h2 class="atx" id="6-reading-text-files-with-filereader">6. Reading Text Files with FileReader</h2>
<h3 class="atx" id="the-problem-2">The problem</h3>
<p> The text saved in <code>data.txt</code> must come back into the program. <code>FileReader</code> fetches it <strong>character by character</strong>.</p>
<h3 class="atx" id="the-example-1">The example</h3>
<pre><code class="fenced-code-block language-java"><span class="token keyword">import</span> <span class="token namespace">java<span class="token punctuation">.</span>io<span class="token punctuation">.</span></span><span class="token operator">*</span><span class="token punctuation">;</span>

<span class="token keyword">class</span> <span class="token class-name">ReadFile</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span> args<span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token class-name">FileReader</span> fr <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">FileReader</span><span class="token punctuation">(</span><span class="token string">"data.txt"</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">int</span> ch<span class="token punctuation">;</span>
            <span class="token keyword">while</span> <span class="token punctuation">(</span><span class="token punctuation">(</span>ch <span class="token operator">=</span> fr<span class="token punctuation">.</span><span class="token function">read</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">print</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token keyword">char</span><span class="token punctuation">)</span> ch<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            fr<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">IOException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span></code></pre>

<h3 class="atx" id="syntax-breakdown-1">Syntax breakdown</h3>
<table>
<thead>
<tr>
<th>Part</th>
<th>Meaning</th>
</tr>
</thead>
<tbody><tr>
<td><code>new FileReader("data.txt")</code></td>
<td>Opens <code>data.txt</code> for reading and returns a reader object stored in <code>fr</code></td>
</tr>
<tr>
<td><code>int ch;</code></td>
<td>A variable that holds each value returned by <code>read()</code></td>
</tr>
<tr>
<td><code>fr.read()</code></td>
<td>Reads <strong>one</strong> character and returns its numeric (Unicode) value, or <code>-1</code> when the file has ended</td>
</tr>
<tr>
<td><code>(ch = fr.read()) != -1</code></td>
<td><strong>Assigns first, then compares.</strong> The parentheses force the assignment to happen before <code>!=</code> is evaluated</td>
</tr>
<tr>
<td><code>(char) ch</code></td>
<td>A <strong>cast</strong> that turns the number back into a character</td>
</tr>
<tr>
<td><code>System.out.print</code></td>
<td>Prints without a newline, so characters appear side by side</td>
</tr>
</tbody></table>
<p></p>
<h3 class="atx" id="why-int-and-not-char">Why <code>int</code> and not <code>char</code>?</h3>
<p><code>read()</code> must be able to return <strong>every</strong> valid character <em>and</em> a special end-of-file signal. A <code>char</code> has no room for a "none left" value, so <code>read()</code> returns an <code>int</code>: <code>0</code> to <code>65535</code> for characters, <code>-1</code> for the end.</p>

<h3 class="atx" id="common-mistakes-1">Common mistakes</h3>
<ul>
<li><strong>Declaring <code>char ch</code> instead of <code>int ch</code>.</strong> Without a cast the code does not compile (an <code>int</code> cannot be stored in a <code>char</code> without a cast). With a cast, <code>-1</code> becomes <code>65535</code>, the <code>!= -1</code> test is always true, and the loop <strong>never ends</strong>.</li>
<li><strong>Forgetting <code>close()</code>.</strong></li>
<li><strong>Wrong file name or location.</strong> If <code>data.txt</code> does not exist, the constructor throws <code>FileNotFoundException</code> (a subclass of <code>IOException</code>), so the <code>catch (IOException e)</code> block handles it.</li>
</ul>

<h2 class="atx" id="7-buffered-streams">7. Buffered Streams</h2>
<h3 class="atx" id="the-problem-3">The problem</h3>
<p>Reading one character at a time means the program keeps asking the disk for tiny pieces of data. Disk access is slow, so this wastes time.</p>
<h3 class="atx" id="the-idea-and-the-analogy-1">The idea and the analogy</h3>
<p>Carrying groceries from the car to the kitchen <strong>one item per trip</strong> is slow. Using a bag to carry many items per trip is faster. A <strong>buffer</strong> is that bag: an area of memory that collects data so the disk is accessed less often.</p>
<blockquote>
<p>The analogy stops at the "bag size": a buffer has a fixed capacity and is filled and emptied automatically, so you never manage individual items yourself.</p>
</blockquote>
<h3 class="atx" id="the-formal-concept-1">The formal concept</h3>
<p><strong>Buffered streams</strong> improve performance by reducing direct disk access. The classes are:</p>
<ul>
<li><strong><code>BufferedReader</code></strong> (instead of reading directly with <code>FileReader</code>)</li>
<li><strong><code>BufferedWriter</code></strong> (instead of writing directly with <code>FileWriter</code>)</li>
</ul>
<h3 class="atx" id="the-example-bufferedreader">The example: BufferedReader</h3>
<p></p>
<pre><code class="fenced-code-block language-java"><span class="token keyword">import</span> <span class="token namespace">java<span class="token punctuation">.</span>io<span class="token punctuation">.</span></span><span class="token operator">*</span><span class="token punctuation">;</span>

<span class="token keyword">class</span> <span class="token class-name">Demo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span> args<span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">IOException</span> <span class="token punctuation">{</span>
        <span class="token class-name">BufferedReader</span> br <span class="token operator">=</span>

<h2 class="atx" id="8-reading-and-writing-binary-files">8. Reading and Writing Binary Files</h2>
<h3 class="atx" id="the-problem-4">The problem</h3>
<p>Not all data is text. Images, videos, and audio files are sequences of <strong>bytes</strong>, not characters. We need streams that move bytes without interpreting them.</p>
<h3 class="atx" id="the-formal-concept-2">The formal concept</h3>
<p><strong>Binary files store data in byte format.</strong> The classes are:</p>
<ul>
<li><strong><code>FileOutputStream</code></strong> for writing</li>
<li><strong><code>FileInputStream</code></strong> for reading</li>
</ul>

        <span class="token class-name">FileOutputStream</span> fos <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">FileOutputStream</span><span class="token punctuation">(</span><span class="token string">"data.dat"</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        fos<span class="token punctuation">.</span><span class="token function">write</span><span class="token punctuation">(</span>b<span class="token punctuation">)</span><span class="token punctuation">;</span>

<h2 class="atx" id="9-serialization">9. Serialization</h2>
<h3 class="atx" id="the-problem-5">The problem</h3>
<p>A <code>Student</code> object has an <code>id</code> and a <code>name</code>. Writing each field to a file separately, and rebuilding the object by hand when reading it back, is tedious and error-prone. We want to save the <strong>whole object</strong> in one step. </p>
<h3 class="atx" id="the-idea-and-the-analogy-2">The idea and the analogy</h3>
<p>Flat-pack furniture is taken apart into pieces, stored or shipped in a box, and later assembled again. <strong>Serialization</strong> takes an object apart into a sequence of bytes. <strong>Deserialization</strong> assembles it again.</p>
<blockquote>
<p>The analogy has one important limit: assembling creates a <strong>new, separate object</strong> with the same data. It is a copy, not the original object.</p>
</blockquote>
<h3 class="atx" id="the-formal-concept-3">The formal concept</h3>
<p><strong>Serialization</strong> is the process of converting an object into a byte stream so that it can be:</p>
<ul>
<li>stored in a file,</li>
<li>sent over a network,</li>
<li>reconstructed later.</li>
</ul>
<p>The reverse process is <strong>deserialization</strong>.</p>
<h3 class="atx" id="the-serializable-interface">The Serializable interface</h3>
<p>Java provides <code>java.io.Serializable</code>. It is a <strong>marker interface</strong>: it has <strong>no methods</strong>. Implementing it simply tags the class, telling Java "objects of this class may be serialized."   </p>

<p></p>
<h3 class="atx" id="creating-a-serializable-class">Creating a serializable class</h3>
<p></p>
<pre><code class="fenced-code-block language-java"><span class="token keyword">import</span> <span class="token namespace">java<span class="token punctuation">.</span>io<span class="token punctuation">.</span></span><span class="token operator">*</span><span class="token punctuation">;</span>

<span class="token keyword">class</span> <span class="token class-name">Student</span> <span class="token keyword">implements</span> <span class="token class-name">Serializable</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> id<span class="token punctuation">;</span>
    <span class="token class-name">String</span> name<span class="token punctuation">;</span>

    <span class="token class-name">Student</span><span class="token punctuation">(</span><span class="token keyword">int</span> id<span class="token punctuation">,</span> <span class="token class-name">String</span> name<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>id <span class="token operator">=</span> id<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>name <span class="token operator">=</span> name<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span></code></pre>
<p>  </p>
<table>
<thead>
<tr>
<th>Part</th>
<th>Meaning</th>
</tr>

<tbody><tr>
<td><code>implements Serializable</code></td>
<td>The class <strong>implements an interface</strong>. (<code>extends</code> is for inheriting from a class; <code>implements</code> is for interfaces.) Because the interface has no methods, nothing else must be written</td>
</tr>
<tr>
<td><code>int id; String name;</code></td>

</tr>

</tr>

<td><code>this.id = id;</code></td>
<td>Left side <code>this.id</code> is the <strong>field</strong>; right side <code>id</code> is the <strong>parameter</strong>. <code>this</code> removes the ambiguity when they share a name</td>

<h3 class="atx" id="writing-an-object-to-a-file">Writing an object to a file</h3>
<p></p>
<pre><code class="fenced-code-block language-java"><span class="token keyword">class</span> <span class="token class-name">SerializeDemo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span> args<span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
        <span class="token class-name">Student</span> s <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Student</span><span class="token punctuation">(</span><span class="token number">101</span><span class="token punctuation">,</span> <span class="token string">"Rahul"</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token class-name">FileOutputStream</span> fos <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">FileOutputStream</span><span class="token punctuation">(</span><span class="token string">"student.ser"</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">ObjectOutputStream</span> out <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ObjectOutputStream</span><span class="token punctuation">(</span>fos<span class="token punctuation">)</span><span class="token punctuation">;</span>

        out<span class="token punctuation">.</span><span class="token function">writeObject</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">;</span>
        out<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        fos<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">"Object Saved"</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span></code></pre>
<p>(<code>import java.io.*;</code> is needed at the top of the file, as in the <code>Student</code> listing above.)   </p>

<thead>
<tr>
<th>Part</th>
<th>Meaning</th>
</tr>
</thead>
<tbody><tr>
<td><code>new Student(101, "Rahul")</code></td>
<td>Creates the object; the constructor sets <code>id</code> and <code>name</code>; <code>s</code> refers to it</td>
</tr>
<tr>
<td><code>new FileOutputStream("student.ser")</code></td>
<td>A byte stream connected to the file <code>student.ser</code> (<code>.ser</code> is the usual extension, not a rule)</td>
</tr>
<tr>

<tr>
<td><code>out.writeObject(s)</code></td>
<td>Serializes <code>s</code> and sends the bytes into the file</td>
</tr>

<h2 class="atx" id="10-the-transient-keyword">10. The transient Keyword</h2>
<h3 class="atx" id="the-problem-6">The problem</h3>
<p>A <code>Student</code> object might hold a <code>password</code>. Saving it in a file is a security risk. We need a way to say "serialize everything <strong>except</strong> this field."</p>
<h3 class="atx" id="the-formal-concept-4">The formal concept</h3>
<p>The <strong><code>transient</code></strong> keyword prevents a variable from being serialized.</p>
<pre><code class="fenced-code-block language-java"><span class="token keyword">class</span> <span class="token class-name">Student</span> <span class="token keyword">implements</span> <span class="token class-name">Serializable</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> id<span class="token punctuation">;</span>
    <span class="token keyword">transient</span> <span class="token class-name">String</span> password<span class="token punctuation">;</span>
<span class="token punctuation">}</span></code></pre>
<p><code>password</code> will <strong>not</strong> be stored.</p>
<h3 class="atx" id="syntax">Syntax</h3>
<pre><code class="fenced-code-block language-java"><span class="token keyword">transient</span> dataType variableName<span class="token punctuation">;</span></code></pre>
<p><code>transient</code> is a <strong>modifier</strong> placed before the type of the field.</p>
<h3 class="atx" id="what-happens-on-reading-back">What happens on reading back</h3>
<p> A transient field is not in the file, so after deserialization it receives its <strong>default value</strong>: <code>null</code> for object references such as <code>String</code>, <code>0</code> for numbers, <code>false</code> for <code>boolean</code>.</p>
<p>Example variation (the same write and read programs as before, with this class and a constructor <code>Student(int id, String password)</code>):</p>
<pre><code class="fenced-code-block language-java"><span class="token keyword">class</span> <span class="token class-name">Student</span> <span class="token keyword">implements</span> <span class="token class-name">Serializable</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> id<span class="token punctuation">;</span>
    <span class="token keyword">transient</span> <span class="token class-name">String</span> password<span class="token punctuation">;</span>

    <span class="token class-name">Student</span><span class="token punctuation">(</span><span class="token keyword">int</span> id<span class="token punctuation">,</span> <span class="token class-name">String</span> password<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>id <span class="token operator">=</span> id<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>password <span class="token operator">=</span> password<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span></code></pre>

<h1 class="atx" id="part-b--collections-and-generics">Part B — Collections and Generics</h1>
<h2 class="atx" id="12-why-we-need-collections">12. Why We Need Collections</h2>
<h3 class="atx" id="the-problem-7">The problem</h3>
<p>A college registration program must store student records, but nobody knows in advance how many students will register. Before the Collections Framework, the tool was the array:</p>
<pre><code class="fenced-code-block language-java"><span class="token keyword">int</span> arr<span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token keyword">int</span><span class="token punctuation">[</span><span class="token number">100</span><span class="token punctuation">]</span><span class="token punctuation">;</span></code></pre>
<p>An array like this has three problems:</p>
<table>
<thead>
<tr>
<th>Problem</th>
<th>What it means</th>
</tr>
</thead>
<tbody><tr>
<td><strong>Fixed size</strong></td>
<td>The size is set at creation. If 150 students register, 100 slots are not enough</td>
</tr>
<tr>
<td><strong>One type only</strong></td>
<td>This array stores only <code>int</code> values. It cannot hold objects of different types</td>
</tr>
<tr>
<td><strong>No built-in searching or sorting methods</strong></td>
<td>The array itself offers no ready-made operations for adding, removing, or searching</td>
</tr>
</tbody></table>
<blockquote>
<p><strong>Note for Review:</strong> Arrays <em>can</em> hold objects (for example <code>String[]</code>) and the <code>java.util.Arrays</code> helper class offers some sorting and searching, so "cannot store different object types" refers to this typed array: each array is fixed to one element type. The central problem is that an array has a fixed size and no built-in data-structure behaviour.</p>
</blockquote>
<h3 class="atx" id="the-idea-and-the-analogy-3">The idea and the analogy</h3>
<p>An array is a <strong>notebook with exactly 100 pages</strong>: when it is full, you cannot add a page. A collection is a <strong>ring binder</strong>: you add or remove pages freely.</p>
<h3 class="atx" id="the-solution">The solution</h3>
<p>Collections solve these problems by providing:</p>
<ul>
<li><strong>Dynamic size:</strong> they grow and shrink as needed.</li>
<li><strong>Ready-made data structures:</strong> lists, sets, queues, and maps are already written.</li>
<li><strong>Efficient operations:</strong> adding, removing, and searching are built in.</li>
</ul>
<hr>
<h2 class="atx" id="13-java-collections-framework">13. Java Collections Framework</h2>
<p>The <strong>Java Collections Framework (JCF)</strong> is a <strong>unified architecture for storing and manipulating groups of objects</strong>. It provides:</p>
<ul>
<li><strong>Interfaces:</strong> the <em>contracts</em> (which operations a kind of collection supports),</li>
<li><strong>Implementation classes:</strong> the actual working code,</li>
<li><strong>Algorithms:</strong> ready-made operations such as sorting and searching.</li>
</ul>
<p>It lives in the <strong><code>java.util</code></strong> package:</p>
<pre><code class="fenced-code-block language-java"><span class="token keyword">import</span> <span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token operator">*</span><span class="token punctuation">;</span></code></pre>
<h3 class="atx" id="interface-versus-class">Interface versus class</h3>
<p>An <strong>interface</strong> says <em>what</em> a collection can do. A <strong>class</strong> says <em>how</em> it does it. For example, <code>List</code> is an interface; <code>ArrayList</code> is a class that implements it.</p>
<h3 class="atx" id="reading-the-architecture-diagrams">Reading the architecture diagrams</h3>
<ul>
<li><strong>Green</strong> boxes are <strong>interfaces</strong>; <strong>orange</strong> boxes are <strong>classes</strong>.</li>
<li>A <strong>solid</strong> arrow means <strong>extends</strong> (inheritance between interfaces, or between classes).</li>
<li>A <strong>dotted</strong> arrow means <strong>implements</strong> (a class implementing an interface).</li>
</ul>
<h3 class="atx" id="the-collection-side">The Collection side</h3>
<div class="plantuml"><img src="https://www.plantuml.com/plantuml/svg/~1U5vjaZ5Fmp0GXVVx5OUOQo4615A7GcW5KWTG4BkRNAbLEoxsPOZK7uzgcyHjFUQzyxrtdxBmB1ttHiFDmSaV8r7BmVQCtX3BJWBR0xB5ZMMs1blbg65bEzYfbf3CWGSqP3RaF83gcDnMDeJlJ4vkDE5jzRXyg9uogx9Qnnq5Swqy5-JFdlhIhffAqw_qMvwsZgdDtq2ZfVVux9mSOlHgjRnxkK_wMdLxQWl6DpLitSLqpRBPNsWVJbcdU4W7d6qFgQdhcV4c_IwqB9GfUr-EA7y18__vSJR32Jbaz8DrEkvA36slr9eOuXtXPMWEfzJmMV_31GZ0vaSX9h2PDa7Dn0WK4jUuy8Hp31G2prX213Ubn3gPckN4aa9WefTQ2u5nQ9J77oHC9wgmeAxjZVu38hK8k0"></div>
<h3 class="atx" id="the-map-side-a-separate-hierarchy">The Map side (a separate hierarchy)</h3>
<p><code>Map</code> does <strong>not</strong> extend <code>Collection</code>. It stores <strong>key-value pairs</strong>, so it forms its own hierarchy.</p>
<div class="plantuml"><img src="https://www.plantuml.com/plantuml/svg/~1U5vjZx4Ama0CXlSyHSIv8WwYu22Aug2Jla3QYtfukIjtwL3muQMbQYkE-VxaIx9EIb4hSJ0g8zs4q54TAiKahEG9D9Ie0VEW6WIDZLoe3HxkrZ2ob5gZiEGS4u3rol5A1UE9IXnl5xlvTjcZvn2LJJ-3mb5AUA1qR_5-lvjkPXqzMlzWypzhg5Bk-6Vc4fdx9cYArNCoUU_uWe5-sDUQEvHb-BaRlX-qpcuRhDcRIjmBlYXioG"></div>

</blockquote>

<h2 class="atx" id="14-the-four-main-interfaces">14. The Four Main Interfaces</h2>
<p>Everything in the framework rests on four interfaces: <strong>List, Set, Queue, and Map</strong>.</p>
<h3 class="atx" id="the-list-interface">The List interface</h3>
<p>A list is like an <strong>attendance register</strong>: entries appear in the order written, the same value may appear twice, and you can ask for "entry number 3".</p>
<p>A <code>List</code>:</p>
<ul>
<li><strong>maintains insertion order,</strong></li>
<li><strong>allows duplicate elements,</strong></li>
<li><strong>allows index-based access.</strong></li>
</ul>
<p>Examples: <code>ArrayList</code>, <code>LinkedList</code>, <code>Vector</code>, <code>Stack</code>.</p>
<h3 class="atx" id="the-set-interface">The Set interface</h3>
<p>A set is like the <strong>collection of registered roll numbers</strong>: every roll number must be unique.</p>
<p>A <code>Set</code>:</p>
<ul>
<li><strong>does not allow duplicate elements,</strong></li>
<li><strong>does not maintain insertion order</strong> (except <code>LinkedHashSet</code>),</li>
<li>is useful for <strong>unique collections</strong>.</li>
</ul>
<p>Examples: <code>HashSet</code>, <code>TreeSet</code>.</p>
<blockquote>
<p><strong>Note for Review:</strong> <code>TreeSet</code> keeps its elements in <em>sorted</em> order, which is different from insertion order. <code>HashSet</code> makes no ordering promise at all.</p>
</blockquote>
<h3 class="atx" id="the-queue-interface">The Queue interface</h3>
<p>A queue is the <strong>fee-payment counter</strong>: the first student to arrive is the first to be served.</p>
<p>A <code>Queue</code> follows <strong>FIFO (First In First Out)</strong>.</p>
<p>Examples: <code>PriorityQueue</code>, <code>LinkedList</code> (and the double-ended <code>Deque</code> family such as <code>ArrayDeque</code>).</p>
<p>Used in:</p>
<ul>
<li><strong>Scheduling,</strong></li>
<li><strong>Resource management.</strong></li>
</ul>
<blockquote>
<p><strong>Note for Review:</strong> <code>PriorityQueue</code> serves elements by <strong>priority</strong>, not strictly by arrival. FIFO is the general rule of the interface; <code>PriorityQueue</code> is the special case where the "front" is the highest-priority element.</p>
</blockquote>
<h3 class="atx" id="the-map-interface">The Map interface</h3>
<p> A map is like a <strong>register of roll numbers and names</strong>: you look up a student by roll number.</p>
<p>A <code>Map</code> stores data as <strong>Key → Value</strong> pairs, written <code>(Key, Value)</code>:</p>
<table>
<thead>
<tr>
<th>Key</th>
<th>Value</th>
</tr>
</thead>
<tbody><tr>
<td>1</td>
<td>A</td>
</tr>
<tr>
<td>2</td>
<td>B</td>
</tr>
<tr>
<td>3</td>
<td>C</td>
</tr>
</tbody></table>
<p>  </p>
<p>Properties:</p>
<ul>
<li><strong>Keys must be unique.</strong></li>
<li><strong>Values can be duplicated.</strong></li>
</ul>
<p>Examples: <code>HashMap</code>, <code>TreeMap</code>.</p>
<blockquote>
<p><strong>Note for Review:</strong> Roll numbers (keys) must be unique, but two students may share the same name (values). <code>List</code>, <code>Set</code>, and <code>Queue</code> hold single values; only <code>Map</code> holds key-value pairs.</p>
</blockquote>
<p></p>
<h3 class="atx" id="comparison">Comparison</h3>
<table>

</tbody></table>
<h3 class="atx" id="supplementary-declaration-syntax-preview">Supplementary: declaration syntax preview</h3>
<pre><code class="fenced-code-block language-java"><span class="token keyword">import</span> <span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token operator">*</span><span class="token punctuation">;</span>

<span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> names <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Set</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">&gt;</span></span> rollNumbers <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashSet</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Queue</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> feeCounter <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">LinkedList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> students <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span></code></pre>
<p>Pattern: <code>InterfaceType&lt;ElementType&gt; variable = new ImplementationClass&lt;ElementType&gt;();</code></p>
<ul>
<li>The <strong>left side</strong> names the interface: what we want the collection to do.</li>
<li>The <strong>right side</strong> names the class that does it, so changing from <code>ArrayList</code> to <code>LinkedList</code> changes only one word.</li>
<li>The part in angle brackets is the <strong>generic type</strong>, explained next.</li>
</ul>

<h2 class="atx" id="15-generics">15. Generics</h2>
<h3 class="atx" id="the-problem-8">The problem</h3>
<p>Consider an <code>ArrayList</code> that is meant to hold only cars. Without any restriction it accepts <strong>anything</strong>: a car, a football, a scooter, a fish. Everything that goes in comes out as a plain <code>Object</code>, and the programmer must remember what each item really is.</p>
<h3 class="atx" id="the-lectureand39s-picture">The lecture's picture</h3>
<table>
<thead>
<tr>
<th></th>
<th>Without generics</th>
<th>With generics</th>
</tr>
</thead>
<tbody><tr>
<td><strong>Going in</strong></td>
<td>References to <code>Car</code>, <code>Football</code>, <code>Scooter</code>, <code>Fish</code> objects</td>
<td>References to <strong>only</strong> <code>Car</code> objects</td>
</tr>
<tr>
<td><strong>Coming out</strong></td>
<td>References of type <code>Object</code></td>
<td>References of type <code>Car</code></td>
</tr>
<tr>
<td><strong>Declaration</strong></td>
<td><code>ArrayList</code></td>
<td><code>ArrayList&lt;Car&gt;</code></td>
</tr>
</tbody></table>
<h3 class="atx" id="the-idea-and-the-analogy-4">The idea and the analogy</h3>
<p>A generic collection is a <strong>labelled bin</strong>. A bin labelled "Cars" refuses a football at the door, and everything you pull out is guaranteed to be a car.</p>
<h3 class="atx" id="without-generics">Without generics</h3>
<pre><code class="fenced-code-block language-java"><span class="token keyword">import</span> <span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token operator">*</span><span class="token punctuation">;</span>

<span class="token keyword">class</span> <span class="token class-name">Car</span> <span class="token punctuation">{</span> <span class="token punctuation">}</span>
<span class="token keyword">class</span> <span class="token class-name">Football</span> <span class="token punctuation">{</span> <span class="token punctuation">}</span>

<span class="token keyword">class</span> <span class="token class-name">WithoutGenerics</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span> args<span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">ArrayList</span> garage <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        garage<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Car</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        garage<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Football</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token class-name">Car</span> first <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Car</span><span class="token punctuation">)</span> garage<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">Car</span> second <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Car</span><span class="token punctuation">)</span> garage<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span></code></pre>
<p>This <strong>compiles</strong> (with a warning about unchecked use), but the last line <strong>fails at runtime</strong> with a <code>ClassCastException</code>, because element <code>1</code> is a <code>Football</code>. The error is found only when the program runs.</p>
<h3 class="atx" id="with-generics">With generics</h3>
<p>General syntax:</p>
<pre><code class="fenced-code-block language-java"><span class="token class-name">ClassName</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Type</span><span class="token punctuation">&gt;</span></span> variable <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ClassName</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Type</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span></code></pre>
<pre><code class="fenced-code-block language-java"><span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Car</span><span class="token punctuation">&gt;</span></span> cars <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Car</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
cars<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Car</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
cars<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Football</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>   <span class="token comment">// INVALID: compile-time error</span>
<span class="token class-name">Car</span> first <span class="token operator">=</span> cars<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>    <span class="token comment">// no cast needed</span></code></pre>
<p>The invalid line is rejected <strong>before the program runs</strong>, because a <code>Football</code> is not a <code>Car</code>. And <code>get(0)</code> already returns a <code>Car</code>, so no cast is required.</p>
<p>(<code>add(...)</code> places an element in the list; <code>get(index)</code> fetches the element at a position, using the index-based access that <code>List</code> provides.)</p>
<h3 class="atx" id="what-generics-give-you">What generics give you</h3>
<table>
<thead>
<tr>
<th>Benefit</th>
<th>Meaning</th>
</tr>
</thead>
<tbody><tr>
<td><strong>Type safety</strong></td>
<td>Wrong types are caught at compile time instead of crashing at runtime</td>
</tr>
<tr>
<td><strong>No casting</strong></td>
<td>Elements come out already typed</td>
</tr>
<tr>
<td><strong>Code reuse</strong></td>
<td>The same <code>ArrayList</code> class works for <code>Car</code>, <code>String</code>, <code>Student</code>, and so on, by changing the type in angle brackets</td>
</tr>
</tbody></table>
<h3 class="atx" id="generics-and-primitive-types">Generics and primitive types</h3>
<p>The type in angle brackets must be a <strong>class</strong>, not a primitive type:</p>
<pre><code class="fenced-code-block language-java"><span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token keyword">int</span><span class="token punctuation">&gt;</span></span> marks <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token keyword">int</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>         <span class="token comment">// INVALID</span>
<span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">&gt;</span></span> marks <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// valid</span></code></pre>
<p>Each primitive has a matching <strong>wrapper class</strong> (for example <code>int</code> ↔ <code>Integer</code>, <code>double</code> ↔ <code>Double</code>). Wrapper classes are how primitive data is handled inside collections, and they are one of the module's stated objectives.</p>
<hr>
<h2 class="atx" id="16-collections-and-generics-summary">16. Collections and Generics Summary</h2>
<ul>
<li>The Java Collections Framework is a <strong>unified architecture</strong> of interfaces, implementation classes, and algorithms, found in <strong><code>java.util</code></strong>.</li>
<li>Collections give <strong>dynamic size</strong>, <strong>ready-made data structures</strong>, and <strong>efficient operations</strong>, which fixed-size arrays do not.</li>
<li>The four main interfaces are <strong>List</strong> (ordered, duplicates, index), <strong>Set</strong> (unique), <strong>Queue</strong> (FIFO), and <strong>Map</strong> (key → value).</li>
<li><strong>Generics</strong> make collections type-safe and reusable.</li>
</ul>
<h3 class="atx" id="which-collection-for-which-job">Which collection for which job?</h3>
<table>
<thead>
<tr>
<th>If you need...</th>
<th>Use</th>
<th>Typical class</th>
</tr>
</thead>
<tbody><tr>
<td>Ordered items, duplicates allowed, access by position</td>
<td><code>List</code></td>
<td><code>ArrayList</code></td>
</tr>
<tr>
<td>Only unique items</td>
<td><code>Set</code></td>
<td><code>HashSet</code> (or <code>TreeSet</code> for sorted)</td>
</tr>
<tr>
<td>Items processed in arrival order (scheduling, resource management)</td>
<td><code>Queue</code></td>
<td><code>LinkedList</code>, <code>PriorityQueue</code></td>
</tr>
<tr>
<td>Look up a value using a unique key</td>
<td><code>Map</code></td>
<td><code>HashMap</code> (or <code>TreeMap</code> for sorted keys)</td>
</tr>
</tbody></table>
